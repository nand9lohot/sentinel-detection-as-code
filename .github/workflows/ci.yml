name: CI

# Pull request gate, also called by deploy.yml before anything reaches Sentinel.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Needed to compare rule IDs and versions with the base branch.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install tooling
        run: |
          pip install -e '.[dev]'
          npm ci --prefix kql-check
      - name: Lint rules and analyze KQL
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            sdac validate --base "origin/$BASE_REF"
          else
            sdac validate
          fi
      - name: Check generated catalog
        run: sdac catalog --check
      - name: Test tooling
        run: pytest -q

  detection-tests:
    name: detection-tests
    runs-on: ubuntu-latest
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install -e .
      - name: Run detections against synthetic logs
        run: sdac test --kusto-uri http://localhost:8080 --wait 300
