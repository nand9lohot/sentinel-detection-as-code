cases:
  - name: A spray with one success fires and reports the success
    expect: fire
    expect_rows: 1
    expect_first_row:
      IPAddress: 203.0.113.50
      FailedAccounts: 12
      FailedAttempts: 12
      SuccessCount: 1
    tables:
      SigninLogs:
        - repeat: 12
          minutes_ago: 10
          ResultType: "50126"
          IPAddress: 203.0.113.50
          UserPrincipalName: user{i}@contoso.com
        - minutes_ago: 5
          ResultType: "0"
          IPAddress: 203.0.113.50
          UserPrincipalName: user3@contoso.com
  - name: A spray with no success fires with a zero count
    expect: fire
    expect_rows: 1
    expect_first_row:
      FailedAccounts: 10
      SuccessCount: 0
    tables:
      SigninLogs:
        - repeat: 10
          minutes_ago: 10
          ResultType: "50126"
          IPAddress: 203.0.113.50
          UserPrincipalName: user{i}@contoso.com
  - name: Nine accounts stay below the threshold
    expect: silent
    tables:
      SigninLogs:
        - repeat: 9
          minutes_ago: 10
          ResultType: "50126"
          IPAddress: 203.0.113.50
          UserPrincipalName: user{i}@contoso.com
  - name: Repeated failures for one user are not a spray
    expect: silent
    tables:
      SigninLogs:
        - repeat: 30
          minutes_ago: 10
          ResultType: "50126"
          IPAddress: 203.0.113.50
          UserPrincipalName: forgetful@contoso.com
  - name: Other failure codes stay silent
    expect: silent
    tables:
      SigninLogs:
        - repeat: 12
          minutes_ago: 10
          ResultType: "50074"
          IPAddress: 203.0.113.50
          UserPrincipalName: user{i}@contoso.com
  - name: Failures from different IP addresses are not combined
    expect: silent
    tables:
      SigninLogs:
        - repeat: 6
          minutes_ago: 10
          ResultType: "50126"
          IPAddress: 203.0.113.50
          UserPrincipalName: user{i}@contoso.com
        - repeat: 6
          minutes_ago: 10
          ResultType: "50126"
          IPAddress: 203.0.113.51
          UserPrincipalName: other{i}@contoso.com
