id: 47c3d1e8-6f92-4ab7-8d15-c0e9b3a6f728
name: Credential added to an application or service principal
description: |
  Identifies a secret or certificate change on an Entra ID application or service principal.
  Attackers use this to keep access through a workload identity. Confirm the initiator owns the
  application and that the change was planned.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AuditLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1098.001
query: |
  let lookback = 1h;
  AuditLogs
  | where TimeGenerated > ago(lookback)
  | where OperationName contains "Certificates and secrets management"
      or OperationName =~ "Add service principal credentials"
  | where Result =~ "success"
  | extend InitiatorUpn = tostring(InitiatedBy.user.userPrincipalName), InitiatorApp = tostring(InitiatedBy.app.displayName)
  | extend Initiator = coalesce(InitiatorUpn, InitiatorApp)
  | extend InitiatorIp = tostring(InitiatedBy.user.ipAddress)
  | extend TargetApp = tostring(TargetResources[0].displayName), TargetId = tostring(TargetResources[0].id)
  | extend AccountName = tostring(split(Initiator, "@")[0]), AccountUPNSuffix = tostring(split(Initiator, "@")[1])
  | project TimeGenerated, OperationName, Initiator, AccountName, AccountUPNSuffix, InitiatorIp, TargetApp, TargetId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
      - identifier: UPNSuffix
        columnName: AccountUPNSuffix
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: InitiatorIp
  - entityType: CloudApplication
    fieldMappings:
      - identifier: Name
        columnName: TargetApp
customDetails:
  OperationName: OperationName
  TargetId: TargetId
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Credential change on {{TargetApp}} by {{Initiator}}"
version: 1.0.0
kind: Scheduled
