id: e1a84f36-9b27-4c05-b6d3-2f7c8e5a9d14
name: Password spray from a single IP address
description: |
  Identifies one IP address failing sign-in with invalid credentials against 10 or more distinct
  accounts within an hour. Treat any account listed in SuccessfulAccounts as potentially
  compromised.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003
query: |
  let lookback = 1h;
  let minAccounts = 10;
  let invalidPassword = "50126";
  let Signins = SigninLogs
      | where TimeGenerated > ago(lookback)
      | where isnotempty(IPAddress);
  let Successes = Signins
      | where ResultType == "0"
      | summarize SuccessfulAccounts = make_set(UserPrincipalName, 20) by IPAddress;
  Signins
  | where ResultType == invalidPassword
  | summarize
      TimeGenerated = max(TimeGenerated),
      StartTime = min(TimeGenerated),
      FailedAccounts = dcount(UserPrincipalName),
      FailedAttempts = count(),
      AccountSample = make_set(UserPrincipalName, 20)
      by IPAddress
  | where FailedAccounts >= minAccounts
  | join kind=leftouter Successes on IPAddress
  | extend SuccessCount = coalesce(array_length(SuccessfulAccounts), 0)
  | project TimeGenerated, StartTime, IPAddress, FailedAccounts, FailedAttempts, AccountSample, SuccessCount, SuccessfulAccounts
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
customDetails:
  FailedAccounts: FailedAccounts
  AccountSample: AccountSample
  SuccessfulAccounts: SuccessfulAccounts
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: "Password spray from {{IPAddress}} against {{FailedAccounts}} accounts"
version: 1.0.0
kind: Scheduled
