cases:
  - name: A user adding an application secret fires
    expect: fire
    expect_rows: 1
    expect_first_row:
      Initiator: mallory@contoso.com
      AccountName: mallory
      InitiatorIp: 203.0.113.10
      TargetApp: payments-api
    tables:
      AuditLogs:
        - minutes_ago: 5
          OperationName: "Update application – Certificates and secrets management "
          Result: success
          InitiatedBy:
            user:
              userPrincipalName: mallory@contoso.com
              ipAddress: 203.0.113.10
          TargetResources:
            - displayName: payments-api
              id: 99999999-0000-0000-0000-000000000001
  - name: An application adding service principal credentials fires
    expect: fire
    expect_first_row:
      Initiator: automation-app
      TargetApp: payments-api
    tables:
      AuditLogs:
        - minutes_ago: 5
          OperationName: Add service principal credentials
          Result: success
          InitiatedBy:
            app:
              displayName: automation-app
          TargetResources:
            - displayName: payments-api
              id: 99999999-0000-0000-0000-000000000001
  - name: A failed attempt stays silent
    expect: silent
    tables:
      AuditLogs:
        - minutes_ago: 5
          OperationName: Add service principal credentials
          Result: failure
          InitiatedBy:
            user:
              userPrincipalName: admin@contoso.com
          TargetResources:
            - displayName: payments-api
  - name: An unrelated application update stays silent
    expect: silent
    tables:
      AuditLogs:
        - minutes_ago: 5
          OperationName: Update application
          Result: success
          InitiatedBy:
            user:
              userPrincipalName: admin@contoso.com
          TargetResources:
            - displayName: payments-api
